name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Install bitmap test dependencies
        run: python -m pip install -r scripts/requirements-test.txt

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Content check
        run: npm run content:check

      - name: Build
        run: npm run build
